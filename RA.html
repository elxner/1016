<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Realidad Aumentada - UMSA</title>

    <!-- A-Frame 1.6.0 -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js 3.4.7 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
      }

      #panel {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        z-index: 100;
        padding: 12px;
        background: rgba(0, 0, 0, 0.82);
        color: white;
        border-radius: 12px;
      }

      #panel h3 {
        margin: 0 0 8px;
        font-size: 17px;
        text-align: center;
      }

      #panel p {
        font-size: 12px;
        margin: 5px 0;
        text-align: center;
      }

      .botones {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        justify-content: center;
        margin-top: 10px;
      }

      button {
        border: none;
        padding: 11px;
        border-radius: 7px;
        background: #1769aa;
        color: white;
        font-weight: bold;
      }

      button:active {
        background: #0b3c68;
      }

      #imagenArchivo {
        display: none;
      }

      #estado {
        color: #80ff9a;
        font-weight: bold;
      }

      a-scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!-- INTERFAZ -->
    <div id="panel">
      <h3>REALIDAD AUMENTADA - UMSA</h3>

      <p>Estudiante: Jesús Larrazábal Salas</p>

      <p>
        Estado del marcador:
        <span id="estado">Esperando tarjeta...</span>
      </p>

      <p>
        Tamaño:
        <span id="estadoTamano">Normal</span>
      </p>

      <div class="botones">
        <button onclick="cambiarTamano()">Cambiar tamaño</button>

        <button onclick="seleccionarImagen()">Elegir imagen</button>

        <button onclick="restaurarCubo()">Volver al cubo</button>
      </div>

      <input
        type="file"
        id="imagenArchivo"
        accept="image/*"
        onchange="cargarImagen(event)"
      />
    </div>

    <!-- ESCENA DE REALIDAD AUMENTADA -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true"
      arjs="
      sourceType: webcam;
      videoTexture: true;
      debugUIEnabled: false;
    "
    >
      <!-- TARJETA A: HIRO -->
      <a-marker id="marcadorHiro" preset="hiro" smooth="true" smoothCount="5">
        <a-entity id="grupoHiro">
          <!-- CUBO AZUL ORIGINAL -->
          <a-box
            id="cuboAzul"
            position="0 0.5 0"
            width="1"
            height="1"
            depth="1"
            color="#0066FF"
            material="metalness: 0.2; roughness: 0.4"
          >
          </a-box>

          <!-- IMAGEN PERSONALIZADA -->
          <a-image
            id="imagenAR"
            position="0 0.02 0"
            rotation="-90 0 0"
            width="1"
            height="1"
            visible="false"
            material="
                  shader: flat;
                  side: double;
                  transparent: true;
                "
          >
          </a-image>
        </a-entity>
      </a-marker>

      <!-- TARJETA B: KANJI -->
      <a-marker id="marcadorKanji" preset="kanji" smooth="true" smoothCount="5">
        <a-entity id="grupoKanji">
          <!-- ESFERA ROJA ORIGINAL -->
          <a-sphere
            id="esferaRoja"
            position="0 0.5 0"
            radius="0.5"
            color="#FF0000"
            material="roughness: 0.35"
          >
          </a-sphere>
        </a-entity>
      </a-marker>

      <!-- CÁMARA -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // ==========================================
      // VARIABLES
      // ==========================================

      let ampliado = false;
      let modoImagen = false;
      let urlImagen = null;

      // ==========================================
      // CAMBIAR TAMAÑO
      // ==========================================

      function cambiarTamano() {
        ampliado = !ampliado;

        const escala = ampliado ? "1.5 1.5 1.5" : "1 1 1";

        document.getElementById("grupoHiro").setAttribute("scale", escala);

        document.getElementById("grupoKanji").setAttribute("scale", escala);

        document.getElementById("estadoTamano").textContent = ampliado
          ? "Ampliado"
          : "Normal";
      }

      // ==========================================
      // SELECCIONAR IMAGEN
      // ==========================================

      function seleccionarImagen() {
        document.getElementById("imagenArchivo").click();
      }

      // ==========================================
      // CARGAR IMAGEN DESDE GALERIA
      // ==========================================

      function cargarImagen(event) {
        const archivo = event.target.files[0];

        if (!archivo) return;

        if (!archivo.type.startsWith("image/")) {
          alert("Selecciona un archivo de imagen.");
          return;
        }

        if (urlImagen) {
          URL.revokeObjectURL(urlImagen);
        }

        urlImagen = URL.createObjectURL(archivo);

        const imagen = document.getElementById("imagenAR");

        const previsualizacion = new Image();

        previsualizacion.onload = function () {
          const proporcion =
            previsualizacion.naturalWidth / previsualizacion.naturalHeight;

          let ancho = 1;
          let alto = 1;

          if (proporcion >= 1) {
            alto = 1 / proporcion;
          } else {
            ancho = proporcion;
          }

          imagen.setAttribute("width", ancho);
          imagen.setAttribute("height", alto);
          imagen.setAttribute("src", urlImagen);

          document.getElementById("cuboAzul").setAttribute("visible", "false");

          imagen.setAttribute("visible", "true");

          modoImagen = true;
        };

        previsualizacion.src = urlImagen;
      }

      // ==========================================
      // VOLVER AL CUBO AZUL
      // ==========================================

      function restaurarCubo() {
        document.getElementById("imagenAR").setAttribute("visible", "false");

        document.getElementById("cuboAzul").setAttribute("visible", "true");

        modoImagen = false;
      }

      // ==========================================
      // DETECCION DE MARCADORES
      // ==========================================

      const hiro = document.getElementById("marcadorHiro");
      const kanji = document.getElementById("marcadorKanji");

      const estado = document.getElementById("estado");

      let hiroVisible = false;
      let kanjiVisible = false;

      hiro.addEventListener("markerFound", function () {
        hiroVisible = true;
        actualizarEstado();
      });

      hiro.addEventListener("markerLost", function () {
        hiroVisible = false;
        actualizarEstado();
      });

      kanji.addEventListener("markerFound", function () {
        kanjiVisible = true;
        actualizarEstado();
      });

      kanji.addEventListener("markerLost", function () {
        kanjiVisible = false;
        actualizarEstado();
      });

      function actualizarEstado() {
        if (hiroVisible && kanjiVisible) {
          estado.textContent = "HIRO y KANJI detectados";
        } else if (hiroVisible) {
          estado.textContent = "HIRO detectado";
        } else if (kanjiVisible) {
          estado.textContent = "KANJI detectado";
        } else {
          estado.textContent = "Esperando tarjeta...";
        }
      }
    </script>
  </body>
</html>
