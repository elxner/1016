<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UMSA - Tarjetas Geométricas AR v2</title>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    #panel {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,0.82); color: white; padding: 10px;
      border-radius: 10px; text-align: center;
    }
    #panel h3 { margin: 0 0 6px; font-size: 16px; }
    #status { font-size: 13px; color: #ffd966; margin: 6px 0; }
    #sizeLabel { color: #4cd964; font-weight: bold; }

    /* Fila de controles: dos selectores + botón de tamaño */
    .controls {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px; margin-top: 8px;
    }
    .controls label {
      font-size: 12px; display: flex; flex-direction: column; align-items: flex-start;
    }
    select, button {
      padding: 8px 12px; font-size: 14px; font-weight: bold;
      border: none; border-radius: 7px; cursor: pointer;
    }
    select { background: #222; color: white; }
    button { background: #007aff; color: white; }
    button:active { background: #005bb5; }

    a-scene { position: fixed; inset: 0; width: 100%; height: 100%; }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <div id="panel">
    <h3>REALIDAD AUMENTADA - UMSA v2</h3>
    <div>Estudiante: Jesús Larrazábal, German Marquez</div>
    <div id="status">Cargando cámara...</div>
    <div>Tamaño: <span id="sizeLabel">Normal</span></div>

    <!-- ===== CONTROLES NUEVOS: selector por marcador + botón tamaño ===== -->
    <div class="controls">
      <label>Objeto sobre HIRO
        <select id="selHiro">
          <option value="cubo">Cubo azul</option>
          <option value="rect">Rectángulo verde</option>
          <option value="cilindro">Cilindro naranja</option>
        </select>
      </label>

      <label>Objeto sobre KANJI
        <select id="selKanji">
          <option value="esfera">Esfera roja</option>
          <option value="rect">Rectángulo amarillo</option>
          <option value="cono">Cono morado</option>
        </select>
      </label>

      <button id="btnSize" style="align-self:flex-end;">CAMBIAR TAMAÑO</button>
    </div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; trackingMethod: best; detectionMode: mono; debugUIEnabled: false; maxDetectionRate: 60; patternRatio: 0.5;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true;"
  >
    <a-light type="ambient" intensity="1"></a-light>

    <!-- ================= MARCADOR HIRO ================= -->
    <a-marker id="markerHiro" preset="hiro" smooth="true" smoothCount="5">
      <a-entity id="groupHiro">
        <!-- Opción 1 (por defecto): cubo azul -->
        <a-box id="hiro-cubo" visible="true"
               position="0 0 0" width="1" height="1" depth="1"
               color="#0066FF"></a-box>

        <!-- Opción 2: rectángulo (plano) verde, tumbado sobre el marcador -->
        <a-plane id="hiro-rect" visible="false"
                 position="0 0.01 0" rotation="-90 0 0"
                 width="1.5" height="0.8"
                 color="#00CC44"></a-plane>

        <!-- Opción 3: cilindro naranja -->
        <a-cylinder id="hiro-cilindro" visible="false"
                    position="0 0 0" radius="0.4" height="1"
                    color="#FF9900"></a-cylinder>
      </a-entity>
    </a-marker>

    <!-- ================= MARCADOR KANJI ================= -->
    <a-marker id="markerKanji" preset="kanji" smooth="true" smoothCount="5">
      <a-entity id="groupKanji">
        <!-- Opción 1 (por defecto): esfera roja -->
        <a-sphere id="kanji-esfera" visible="true"
                  position="0 0 0" radius="0.5"
                  color="#FF0000"></a-sphere>

        <!-- Opción 2: rectángulo amarillo -->
        <a-plane id="kanji-rect" visible="false"
                 position="0 0.01 0" rotation="-90 0 0"
                 width="1.5" height="0.8"
                 color="#FFDD00"></a-plane>

        <!-- Opción 3: cono morado -->
        <a-cone id="kanji-cono" visible="false"
                position="0 0 0" radius-bottom="0.5" height="1"
                color="#9933FF"></a-cone>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (function() {
      const statusEl  = document.getElementById('status');
      const sizeLabel = document.getElementById('sizeLabel');
      const btnSize   = document.getElementById('btnSize');
      const selHiro   = document.getElementById('selHiro');
      const selKanji  = document.getElementById('selKanji');

      let enlarged = false;

      // ---------------------------------------------------------
      // FUNCIÓN AUXILIAR: mostrar solo un objeto de un grupo
      // ---------------------------------------------------------
      // 'group' es el id del contenedor (groupHiro / groupKanji)
      // 'suffix' es el sufijo del objeto a mostrar (cubo, rect, ...)
      // Se ocultan todos los hijos del grupo y se muestra solo el elegido.
      function mostrarObjeto(groupId, suffix) {
        const group = document.getElementById(groupId);
        if (!group) return;
        // Recorre todos los hijos del grupo (cubo, rect, cilindro...)
        Array.from(group.children).forEach(child => {
          // El id de cada hijo tiene la forma "hiro-cubo", "hiro-rect", etc.
          // Mostramos solo el que termina con el sufijo elegido.
          const coincide = child.id.endsWith('-' + suffix);
          child.setAttribute('visible', coincide);
        });
      }

      // ---------------------------------------------------------
      // SELECTOR DE HIRO
      // ---------------------------------------------------------
      selHiro.addEventListener('change', function() {
        mostrarObjeto('groupHiro', selHiro.value);
        statusEl.textContent = 'Hiro: ' + selHiro.options[selHiro.selectedIndex].text;
      });

      // ---------------------------------------------------------
      // SELECTOR DE KANJI
      // ---------------------------------------------------------
      selKanji.addEventListener('change', function() {
        mostrarObjeto('groupKanji', selKanji.value);
        statusEl.textContent = 'Kanji: ' + selKanji.options[selKanji.selectedIndex].text;
      });

      // ---------------------------------------------------------
      // BOTÓN DE TAMAÑO (igual que antes)
      // ---------------------------------------------------------
      btnSize.addEventListener('click', function() {
        enlarged = !enlarged;
        const scale = enlarged ? 1.5 : 1.0;
        const scaleStr = `${scale} ${scale} ${scale}`;

        const groupHiro  = document.getElementById('groupHiro');
        const groupKanji = document.getElementById('groupKanji');
        if (groupHiro)  groupHiro.setAttribute('scale', scaleStr);
        if (groupKanji) groupKanji.setAttribute('scale', scaleStr);

        sizeLabel.textContent = enlarged ? 'Ampliado' : 'Normal';
      });

      // ---------------------------------------------------------
      // EVENTOS DE CÁMARA Y MARCADORES (feedback)
      // ---------------------------------------------------------
      const scene = document.querySelector('a-scene');
      if (scene) {
        scene.addEventListener('loaded',      () => { statusEl.textContent = 'Cámara activa. Enfoca Hiro o Kanji.'; });
        scene.addEventListener('camera-init', () => { statusEl.textContent = 'Cámara activa. Enfoca Hiro o Kanji.'; });
        scene.addEventListener('camera-error',() => { statusEl.textContent = 'ERROR: Permiso de cámara denegado o HTTPS no disponible.'; });
      }

      const hiro = document.getElementById('markerHiro');
      if (hiro) {
        hiro.addEventListener('markerFound', () => { statusEl.textContent = 'Hiro detectado: ' + selHiro.options[selHiro.selectedIndex].text; });
        hiro.addEventListener('markerLost',  () => { statusEl.textContent = 'Cámara activa. Enfoca Hiro o Kanji.'; });
      }
      const kanji = document.getElementById('markerKanji');
      if (kanji) {
        kanji.addEventListener('markerFound', () => { statusEl.textContent = 'Kanji detectado: ' + selKanji.options[selKanji.selectedIndex].text; });
        kanji.addEventListener('markerLost',  () => { statusEl.textContent = 'Cámara activa. Enfoca Hiro o Kanji.'; });
      }
    })();
  </script>
</body>
</html>
